name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        go: ["1.26.0", "1.26.5"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules tidy
        env:
          GOWORK: off
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff -u go.mod.bak go.mod
          diff -u go.sum.bak go.sum
          rm -f go.mod.bak go.sum.bak

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          GOWORK: off
        run: go vet ./...

      - name: golangci-lint
        env:
          GOWORK: off
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: go test
        env:
          GOWORK: off
        run: go test -race -count=1 ./...

      - name: go build
        env:
          GOWORK: off
        run: go build ./...

      - name: CLI smoke
        env:
          GOWORK: off
        run: |
          go build -o gitvalet ./cmd/gitvalet
          ./gitvalet
          ./gitvalet help
          ./gitvalet version
          ./gitvalet unknown || test $? = 2
          ./gitvalet sync --dry-run

      - name: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
